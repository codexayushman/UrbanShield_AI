[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Environment variables are set in the Netlify dashboard or via CLI.
# The app runs in demo mode when Supabase credentials are not available.
